[package]
name = "qliber"
version = "0.1.0"
edition = "2024"
description = "A Rust reimagination of Microsoft's Qlib for quantitative research"
authors = ["Qlib Rust Port Team"]
license = "Apache-2.0"
repository = "https://github.com/microsoft/qlib"

[features]
default = ["ollama"]
ollama = []
gguf = ["llama_cpp"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
polars = { version = "0.34", features = ["lazy", "csv", "temporal", "dtype-date", "dtype-datetime", "json"] }
rayon = "1.8"
once_cell = "1.19"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter", "time"] }
reqwest = { version = "0.11", features = ["blocking", "json"], optional = false }
llama_cpp = { version = "0.3.2", optional = true, default-features = false, features = ["compat"] }
smartcore = { version = "0.4.5", default-features = false }
nalgebra = { version = "0.32" }

[dev-dependencies]
approx = "0.5"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
httpmock = "0.7"
